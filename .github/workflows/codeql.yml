name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@d97b3428e8eebbb1810cf454d6397886d136b4ba
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@d97b3428e8eebbb1810cf454d6397886d136b4ba

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@d97b3428e8eebbb1810cf454d6397886d136b4ba
